# .github/workflows/docker-demos.yml
##
# builds one image per demos/<name>/ that changed AND has a Dockerfile.
# - PRs build Dockerfiles 
# - pushes to main build and push to the ghcr registry
# - manual runs rebuild everything
##
name: Demo images

on:
  push:
    branches: [main]
    paths: ["demos/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.find.outputs.demos }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history so we can diff

      - name: Find changed demos with a Dockerfile
        id: find
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            dirs=$(find demos -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n')
          else
            if [[ "$EVENT" == "pull_request" ]]; then
              base="$PR_BASE"
            else
              base="$BEFORE"
            fi
            if [[ "$base" =~ ^0+$ ]]; then base=$(git rev-list --max-parents=0 HEAD); fi
            dirs=$(git diff --name-only "$base" "$GITHUB_SHA" -- demos/ \
                   | cut -d/ -f1-2 | sort -u)
          fi
          demos=$(for d in $dirs; do if [[ -f "$d/Dockerfile" ]]; then basename "$d"; fi; done \
                  | jq -R . | jq -cs .)
          echo "Demos to build: $demos"
          echo "demos=$demos" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.demos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # broken demos don't cancel others
      matrix:
        demo: ${{ fromJson(needs.detect.outputs.demos) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.demo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: demos/${{ matrix.demo }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.demo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.demo }}
